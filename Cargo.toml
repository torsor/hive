[workspace]
resolver = "2"
members = [
    "crates/hive-protocol",
    "crates/hive-common",
    "crates/hive-client",
    "crates/hive-host",
    "crates/hive-hub",
    "crates/hive-web",
    "crates/hive-cli",
    "crates/hive-local-agents",
]
exclude = ["apps/hive-panel/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["torsor lab"]

[workspace.dependencies]
hive-protocol = { path = "crates/hive-protocol" }
hive-common = { path = "crates/hive-common" }
hive-client = { path = "crates/hive-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
walkdir = "2"
shlex = "1"
