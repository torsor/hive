# Role: base_packages
# Purpose: OS prerequisites for hive fleet hosts.
# Consumes: base_packages (role default).
# Produces: apt packages present.
# Ordering: first.
- name: Install hive fleet host OS prerequisites
  become: true
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
  tags: [packages]
