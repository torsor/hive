# Role: client_config
# Purpose: seed laptop ~/.hive/client.toml when missing.
# Consumes: hive_hub_host, client_config_path.
# Produces: client.toml with hub hostname.
# Ordering: localhost play after client_hostsfile.
- name: Ensure ~/.hive exists on the client
  ansible.builtin.file:
    path: "{{ client_config_path | dirname }}"
    state: directory
    mode: "0755"
  tags: [clientconfig]

- name: Check for existing client.toml
  ansible.builtin.stat:
    path: "{{ client_config_path }}"
  register: hive_client_toml
  tags: [clientconfig]

- name: Seed client.toml when missing
  ansible.builtin.template:
    src: client.toml.j2
    dest: "{{ client_config_path }}"
    mode: "0644"
  when: not hive_client_toml.stat.exists
  tags: [clientconfig]
